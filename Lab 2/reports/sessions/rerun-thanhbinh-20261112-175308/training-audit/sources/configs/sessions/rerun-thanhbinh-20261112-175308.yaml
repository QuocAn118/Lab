seed: 42
data:
  data_dir: data
  train_size: 22500
  val_size: 2500
  test_size: 5000
  image_size: 224
  crop_padding: 4
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  num_workers: 2
model:
  dropout: 0.2
training:
  weight_decay: 0.0001
  max_epochs: 6
  scheduler_patience: 2
  early_stopping_patience: 3
  early_stopping_threshold: 0.01
  log_every_batches: 50
  eval_batch_size: 128
runs:
- name: resnet18_baseline
  purpose: Mô hình gốc
  model: resnet18
  learning_rate: 0.001
  batch_size: 64
- name: densenet121
  purpose: Exercise 1, đổi model
  model: densenet121
  learning_rate: 0.001
  batch_size: 64
- name: resnet18_lr1e-2
  purpose: Exercise 2, đổi learning rate
  model: resnet18
  learning_rate: 0.01
  batch_size: 64
- name: resnet18_bs128
  purpose: Exercise 2, đổi batch size
  model: resnet18
  learning_rate: 0.001
  batch_size: 128
paths:
  reports_dir: reports/sessions/rerun-thanhbinh-20261112-175308/reports
  checkpoints_dir: reports/sessions/rerun-thanhbinh-20261112-175308/checkpoints
kpi:
  accuracy: 0.8
  macro_f1: 0.8
  seconds_per_epoch: 300
  latency_ms: 25
  peak_vram_gb: 4.0
  peak_ram_gb: 6.0
