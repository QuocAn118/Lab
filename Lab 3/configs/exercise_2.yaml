# Tham số Exercise 2. Mỗi giá trị phải khớp docs/data.md và docs/training.md.
seed: 42
model_name: distilbert-base-uncased

data:
  dataset_name: stanfordnlp/imdb
  train_size: 1000
  val_size: 200
  test_size: 200
  max_length: 256

training:
  learning_rate: 2.0e-5
  batch_size: 16
  max_epochs: 5
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 0
  logging_steps: 20
  early_stopping_patience: 2
  early_stopping_threshold: 0.01

paths:
  checkpoints_dir: checkpoints
  reports_dir: reports

# Mục tiêu nghiệm thu trong docs/evaluation.md.
kpi:
  accuracy: 0.85
  macro_f1: 0.85
  seconds_per_epoch: 180
  latency_ms: 25
  peak_vram_gb: 4.0
  peak_ram_gb: 6.0
